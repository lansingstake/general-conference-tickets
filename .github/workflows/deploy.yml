name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install
        run: npm ci
        working-directory: source

      # The Apps Script URL comes from source/.env.production. Do not set
      # VITE_APPS_SCRIPT_URL here: an unset repo secret expands to an empty
      # string, and an empty env var shadows the .env file, which ships a build
      # that asks every visitor to paste in the URL.
      - name: Build
        run: npm run build
        working-directory: source

      - name: Fail if the script URL was not baked in
        working-directory: source
        run: |
          if ! grep -rq "script.google.com/macros" dist/assets/*.js; then
            echo "::error::Built bundle has no Apps Script URL — check source/.env.production"
            exit 1
          fi
          echo "Apps Script URL is present in the bundle."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
